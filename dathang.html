<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quán Ăn Việt - Đặt Món Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>QUÁN ĂN VIỆT</h1>
        <p>Món ngon truyền thống - Đặt món online</p>
    </header>

    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="index.html#monan">Món ăn</a>
        <a href="dathang.html">Thông tin đặt món</a>
        <a href="#lienhe">Liên hệ</a>
    </nav>

    <div class="container">

        <div class="order-section" id="thongtin">

            <h2>🛒 THÔNG TIN ĐẶT MÓN</h2>

            <form>

                <label>Họ và tên:</label>
                <input type="text" placeholder="Nhập họ và tên">

                <label>Số điện thoại:</label>
                <input type="text" placeholder="Nhập số điện thoại">

                <label>Chọn món:</label>
                <select>
                    <option>Cơm tấm sườn - 45.000đ</option>
                    <option>Phở bò - 50.000đ</option>
                    <option>Hủ tiếu - 45.000đ</option>
                    <option>Thịt kho trứng - 55.000đ</option>
                    <option>Cơm phần - 40.000đ</option>
                    <option>Bún thịt nướng - 45.000đ</option>
                    <option>Bánh mì thịt - 30.000đ</option>
                    <option>Cơm gà - 50.000đ</option>
                    <option>Bún bò Huế - 50.000đ</option>
                </select>

                <label>Số lượng:</label>
                <input type="number" value="1" min="1">

                <label>Địa chỉ nhận hàng:</label>
                <textarea placeholder="Nhập địa chỉ giao hàng"></textarea>

                <label>Ghi chú:</label>
                <textarea placeholder="Ví dụ: Không hành, ít cay..."></textarea>

                <button class="submit" type="submit">
                    Xác nhận đặt món
                </button>

            </form>

        </div>

    </div>

    <footer id="lienhe">
        <p>© 2026 Quán Ăn Việt</p>
        <p>Hotline: 0123 456 789</p>
    </footer>

</body>
</html>
